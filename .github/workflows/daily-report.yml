name: Daily stock report

on:
  push:
    branches: [main]
  schedule:
    # UTC 00:00 = Asia/Taipei 08:00, Monday through Friday.
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Actually send the report by email'
        type: boolean
        default: false
      demo:
        description: 'Use fictional prices; email must be disabled'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-stock-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate implementation
        run: python -m unittest discover -s tests -v
      - name: Generate report and optionally email
        env:
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
          AUTOMATIC: ${{ github.event_name == 'schedule' }}
          DEMO: ${{ inputs.demo || false }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          args=()
          if [[ "$AUTOMATIC" == 'true' && ( -z "$SMTP_USERNAME" || -z "$SMTP_PASSWORD" || -z "$EMAIL_FROM" || -z "$EMAIL_TO" ) ]]; then
            SEND_EMAIL=false
            echo '::warning::SMTP secrets are incomplete. Generating the report without email.'
            echo 'Email was skipped: configure SMTP_USERNAME, SMTP_PASSWORD, EMAIL_FROM and EMAIL_TO in repository secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$SEND_EMAIL" == 'true' ]]; then args+=(--send-email); fi
          if [[ "$DEMO" == 'true' ]]; then args+=(--demo); fi
          python -m stock_report "${args[@]}"
      - name: Show report in Actions summary
        if: always()
        shell: bash
        run: |
          if [[ -f reports/report.md ]]; then
            cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f reports/demo/report.md ]]; then
            cat reports/demo/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
